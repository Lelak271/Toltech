name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # nécessaire pour créer la Release

jobs:
  release:
    runs-on: windows-latest

    steps:
      # --- Les 5 repos publics, côte à côte ---
      - name: Checkout Toltech.App
        uses: actions/checkout@v4
        with:
          path: Toltech.App

      - name: Checkout Toltech.Solver.Contracts
        uses: actions/checkout@v4
        with:
          repository: Lelak271/toltech-contracts
          path: Toltech.Solver.Contracts

      - name: Checkout Toltech.Solver.Mock
        uses: actions/checkout@v4
        with:
          repository: Lelak271/toltech-solver-mock
          path: Toltech.Solver.Mock

      - name: Checkout Toltech.Cad
        uses: actions/checkout@v4
        with:
          repository: Lelak271/toltech-cad
          path: Toltech.Cad

      - name: Checkout Toltech.FreeCAD
        uses: actions/checkout@v4
        with:
          repository: Lelak271/toltech-freecad
          path: Toltech.FreeCAD

      # Volontairement : AUCUN checkout de Toltech.Solver (privé)

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Calcul de la version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT
          "folder=Toltech-$v-win-x64" >> $env:GITHUB_OUTPUT

      - name: Publish (win-x64, self-contained, Mock)
        shell: pwsh
        run: |
          dotnet publish Toltech.App/Toltech.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:SolverImpl=Mock `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o "${{ steps.ver.outputs.folder }}"

      - name: Vérifier l'absence du vrai Solver
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path "${{ steps.ver.outputs.folder }}" -Recurse -Filter "Toltech.Solver.dll"
          if ($found) { Write-Error "Toltech.Solver.dll présent dans le publish !"; exit 1 }
          if (-not (Test-Path "${{ steps.ver.outputs.folder }}/Toltech.App.exe")) {
            Write-Error "Toltech.App.exe introuvable"; exit 1
          }

      - name: Créer le ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.ver.outputs.folder }}" `
            -DestinationPath "${{ steps.ver.outputs.folder }}.zip"

      - name: Créer la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.ver.outputs.folder }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}